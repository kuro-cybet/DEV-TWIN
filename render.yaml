services:
  - type: web
    name: devtwin-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devtwin-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://devtwin.vercel.app,http://localhost:5173

databases:
  - name: devtwin-db
    databaseName: devtwin
    user: devtwin
    plan: free
